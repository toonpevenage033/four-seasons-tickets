<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner — Four Seasons Feest</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <main class="scan-wrap">
    <h1>Ticket scanner</h1>
    <p>Voer eenmalig de staff-toegangscode in. Scan daarna de QR-code of typ de ticketcode die erboven staat.</p>

    <form id="token-form" class="order-form">
      <label>
        Staff-toegangscode
        <input type="password" name="token" required />
      </label>
      <button type="submit">Start scanner</button>
      <p id="token-error" class="error" hidden>Ongeldige toegangscode.</p>
    </form>

    <div id="scan-controls" hidden>
      <div id="reader"></div>
      <p id="camera-error" class="error" role="status" hidden></p>

      <form id="manual-form" class="manual-code-form">
        <label for="manual-code">Ticketcode handmatig invoeren</label>
        <div class="manual-code-row">
          <input id="manual-code" name="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required />
          <button type="submit">Controleer</button>
        </div>
        <p class="manual-code-hint">Hoofdletters en kleine letters tellen mee.</p>
      </form>
    </div>
    <div id="result" class="result-banner" hidden></div>
    <button id="next-btn" class="next-btn" hidden>Volgende bezoeker</button>
  </main>

  <script src="scan.js"></script>
</body>
</html>
