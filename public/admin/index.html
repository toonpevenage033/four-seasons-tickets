<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Bestellingen Four Seasons Feest</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="container admin-wrap">
    <h1>Bestellingen beheren</h1>

    <form id="token-form" class="order-form">
      <label>
        Admin-toegangscode
        <input type="password" name="token" required />
      </label>
      <button type="submit">Inloggen</button>
      <p id="token-error" class="error" hidden>Ongeldige admin-toegangscode.</p>
    </form>

    <div id="app" hidden>
      <div id="stats-box" class="stats-box"></div>
      <section class="social-ticket-panel">
        <h2>Betaalde socialtickets versturen</h2>
        <p>Een regel per e-mailadres, als <strong>e-mailadres,aantal</strong>. Er wordt €25 per ticket geregistreerd.</p>
        <form id="social-ticket-form">
          <label for="social-ticket-list">E-mailadressen en aantallen</label>
          <textarea id="social-ticket-list" class="social-ticket-input" rows="10" required></textarea>
          <label class="checkbox-label">
            <input id="social-ticket-paid" type="checkbox" required />
            Ik bevestig dat alle tickets in deze lijst betaald zijn
          </label>
          <button id="social-ticket-submit" class="approve-btn" type="submit">Maak tickets en verstuur e-mails</button>
          <p id="social-ticket-result" class="admin-notice" role="status" hidden></p>
        </form>
      </section>
      <input id="search-input" class="search-input" type="text" placeholder="Zoek op referentiecode, naam of e-mail..." />
      <button id="refresh-btn" class="secondary-btn">Ververs lijst</button>
      <p id="admin-notice" class="admin-notice" hidden></p>
      <table class="orders-table">
        <thead>
          <tr>
            <th>Datum</th>
            <th>Naam</th>
            <th>E-mail</th>
            <th>Aantal</th>
            <th>Bedrag</th>
            <th>Referentie</th>
            <th>Status</th>
            <th>Actie</th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
